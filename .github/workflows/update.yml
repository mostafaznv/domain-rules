name: Update Rules

on:
  schedule:
    # Every 2 days at 04:00 UTC
    - cron: "0 4 */2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"

      - name: Generate Rule Files
        run: |
          go run .
          echo "----- Generated files -----"
          ls -la *.yaml *.conf || true

      - name: Verify Files Exist
        run: |
          for f in clash-iran.yaml clash-ads.yaml clash-apple.yaml shadowrocket.conf; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f"
              exit 1
            fi
            echo "✓ $f ($(wc -l < "$f") lines)"
          done

      - name: Prepare Release Info
        id: prep
        run: |
          TIMESTAMP=$(date -u +%Y%m%d%H%M)
          echo "tag=v$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "name=$TIMESTAMP" >> $GITHUB_OUTPUT

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: ${{ steps.prep.outputs.name }}
          files: |
            clash-iran.yaml
            clash-ads.yaml
            clash-apple.yaml
            shadowrocket.conf
          body: |
            Automated update of domain lists from [v2fly/domain-list-community](https://github.com/v2fly/domain-list-community).

            **Assets:**
            - `clash-iran.yaml`
            - `clash-ads.yaml`
            - `clash-apple.yaml`
            - `shadowrocket.conf`